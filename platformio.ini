; PlatformIO project for the PB16 "SM Receiver Out SMD" smart receiver.
; Uses earlephilhower/arduino-pico (https://github.com/earlephilhower/arduino-pico)
; via the maxgerhardt raspberrypi platform, which tracks arduino-pico releases
; much more closely than PlatformIO's own "raspberrypi" platform package.
;
; Two hardware revisions, selected by which environment you build -- see
; BoardConfig.h for what BOARD_REV1/BOARD_REV2 actually change (EN1-4 and
; the address dial's pins; everything else is identical):
;   sm_receiver_rev1: Pico module. Current/confirmed hardware.
;   sm_receiver_rev2: Waveshare RP2040-Tiny (smaller PCB). Not yet built --
;                     pin choices are unverified against real hardware.
; `board = rpipico` (generic) works for both: the RP2040-Tiny uses the same
; flash chip family/size PlatformIO's rpipico definition already assumes,
; and BoardConfig.h defines every functional pin directly rather than
; relying on any board-specific pin aliases.

[platformio]
default_envs = sm_receiver_rev1

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

; Bump if/when the board moves to RP2350 (e.g. board = rpipico2 / adafruit_feather_rp2350).
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

[env:sm_receiver_rev1]
build_flags = -D BOARD_REV1

[env:sm_receiver_rev2]
build_flags = -D BOARD_REV2
